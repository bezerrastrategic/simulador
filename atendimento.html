<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atendimento Estratégico | Bezerra Strategic</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --accent-gold: #d4af37;
            --accent-gold-hover: #f1c40f;
            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-family);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: 100%;
            max-width: 520px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand-title {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .brand-subtitle {
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--accent-gold);
            margin-bottom: 24px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 32px 28px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .card-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
            text-align: center;
        }

        .card-description {
            font-size: 14px;
            color: var(--text-secondary);
            text-align: center;
            line-height: 1.5;
            margin-bottom: 28px;
        }

        /* Ajuste de estilos no formulário incorporado do HubSpot */
        .hs-form-frame iframe {
            width: 100% !important;
        }

        .footer {
            margin-top: 32px;
            text-align: center;
            font-size: 12px;
            color: var(--text-secondary);
        }

        @media (max-width: 480px) {
            body {
                padding: 16px 12px;
            }
            .card {
                padding: 24px 18px;
            }
            .brand-title {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header class="header">
            <h1 class="brand-title">Bezerra Strategic</h1>
            <p class="brand-subtitle">Planejamento & Consultoria</p>
        </header>

        <main class="card">
            <h2 class="card-title">Agende seu Atendimento</h2>
            <p class="card-description">
                Preencha os campos abaixo para dar início ao seu atendimento e agendar sua conversa estratégica.
            </p>

            <!-- Script e contêiner do formulário HubSpot -->
            <script src="https://js.hsforms.net/forms/embed/51784410.js" defer></script>
            <div class="hs-form-frame" data-region="na1" data-form-id="9463f943-26bd-43e4-a6f8-d4c94b20ad59" data-portal-id="51784410"></div>
        </main>

        <footer class="footer">
            <p>&copy; Bezerra Strategic. Todos os direitos reservados.</p>
        </footer>
    </div>

</body>
</html>
