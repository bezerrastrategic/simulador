        font-weight: bold;

    .btn-primary {

        color: #0b1724;
        border: 1px solid #b89324;
        box-shadow: 0 4px 12px rgba(212, 175, 55, 0.25);
    }
    .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 16px rgba(212, 175, 55, 0.4);
    }
    .btn-secondary {
        background-color: #0b1724;
        color: #ffffff;
        border: 1px solid #1a3554;
    }
    .btn-secondary:hover {
        border-color: #d4af37;
        color: #d4af37;
        transform: translateY(-2px);
    }
    footer {
