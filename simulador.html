<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estudo Patrimonial | Bezerra Strategic</title>
<meta name="description" content="Solicite seu estudo patrimonial personalizado. Soluções em consórcios estruturados, crédito e wealth management.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">

<style>
  :root{
    --navy:#0B1D33;
    --navy-2:#122841;
    --ivory:#F6F3EC;
    --brass:#B8963E;
    --brass-light:#D9BE72;
    --slate:#5C6B7A;
    --line:rgba(246,243,236,0.14);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--navy);
    color:var(--ivory);
    font-family:'Inter', sans-serif;
    line-height:1.6;
  }
  a{color:inherit; text-decoration:none;}
  .wrap{max-width:800px; margin:0 auto; padding:0 24px;}

  header.top{
    background:var(--navy);
    padding:20px 0;
    border-bottom:1px solid var(--line);
  }
  header.top .wrap{
    display:flex;
    align-items:center;
    justify-content:space-between;
    max-width:1080px;
  }
  .brand img{height:50px; width:auto; border-radius:4px;}
  .btn-voltar{
    border:1px solid rgba(246,243,236,0.35);
    color:var(--ivory);
    padding:8px 18px;
    font-size:0.85rem;
    border-radius:3px;
    transition:background 0.2s ease;
  }
  .btn-voltar:hover{background:rgba(246,243,236,0.08);}

  .simulador-container{padding:60px 0 80px;}
  .simulador-card{
    background:var(--navy-2);
    border:1px solid var(--line);
    border-radius:8px;
    padding:40px 32px;
    box-shadow:0 16px 40px rgba(0,0,0,0.4);
  }
  .simulador-card h1{
    font-family:'Fraunces', serif;
    font-size:clamp(1.8rem, 3.5vw, 2.4rem);
    color:var(--ivory);
    margin-bottom:12px;
  }
  .simulador-card p.sub{
    color:rgba(246,243,236,0.75);
    font-size:0.98rem;
    margin-bottom:32px;
  }

  .form-group{margin-bottom:20px;}
  .form-group label{
    display:block;
    font-size:0.85rem;
    color:var(--brass-light);
    font-weight:600;
    margin-bottom:7px;
  }
  .form-group input, .form-group select{
    width:100%;
    padding:13px 15px;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(217,190,114,0.35);
    border-radius:4px;
    color:var(--ivory);
    font-size:0.95rem;
    font-family:'Inter', sans-serif;
    outline:none;
  }
  .form-group select{
    -webkit-appearance:none; appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9' viewBox='0 0 14 9'><path d='M1 1l6 6 6-6' stroke='%23D9BE72' stroke-width='2' fill='none' fill-rule='evenodd'/></svg>");
    background-repeat:no-repeat;
    background-position:right 16px center;
  }
  .form-group input::placeholder{color:rgba(246,243,236,0.4);}
  .form-group input:focus, .form-group select:focus{border-color:var(--brass);}

  .btn-submit{
    width:100%;
    padding:16px 0;
    background:var(--brass);
    border:none;
    border-radius:4px;
    color:var(--navy);
    font-size:1rem;
    font-weight:700;
    text-transform:uppercase;
    cursor:pointer;
    margin-top:8px;
    transition:background 0.2s ease;
  }
  .btn-submit:hover{background:var(--brass-light);}
  .btn-submit:disabled{opacity:0.7; cursor:not-allowed;}

  .success-message{
    display:none;
    text-align:center;
    padding:20px 0 4px;
  }
  .success-message .icon{
    width:52px; height:52px;
    margin:0 auto 18px;
    border-radius:50%;
    background:rgba(184,150,62,0.15);
    display:flex; align-items:center; justify-content:center;
  }
  .success-message h2{
    font-family:'Fraunces', serif;
    font-size:1.4rem;
    color:var(--ivory);
    margin-bottom:10px;
  }
  .success-message p{
    color:rgba(246,243,236,0.75);
    font-size:0.95rem;
    max-width:420px;
    margin:0 auto;
  }

  footer{
    background:var(--navy);
    color:rgba(246,243,236,0.5);
    padding:32px 0;
    text-align:center;
    font-size:0.82rem;
    border-top:1px solid var(--line);
  }

  @media(max-width:600px){
    .simulador-card{padding:24px 16px;}
  }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a href="index.html" class="brand">
      <img src="banner.jpeg" alt="Bezerra Strategic">
    </a>
    <a href="index.html" class="btn-voltar">← Voltar ao site</a>
  </div>
</header>

<main class="wrap simulador-container">
  <div class="simulador-card">
    <h1>Estudo Patrimonial Personalizado</h1>
    <p class="sub">Preencha os dados abaixo para alinharmos a melhor estratégia de crédito, consórcio ou alavancagem para o seu momento.</p>

    <form id="simuladorForm">
      <div class="form-group">
        <label for="nome">Nome Completo</label>
        <input type="text" id="nome" placeholder="Digite seu nome" required>
      </div>

      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="seuemail@dominio.com" required>
      </div>

      <div class="form-group">
        <label for="telefone">WhatsApp / Telefone</label>
        <input type="tel" id="telefone" placeholder="(47) 99999-9999" maxlength="15" oninput="mascaraTelefone(this)" required>
      </div>

      <div class="form-group">
        <label for="objetivo">Objetivo Principal</label>
        <select id="objetivo" required>
          <option value="Consórcio Imobiliário / Aquisição de Imóvel">Consórcio Imobiliário / Aquisição de Imóvel</option>
          <option value="Consórcio de Veículos / Frota / Pesados">Consórcio de Veículos / Frota / Pesados</option>
          <option value="Financiamento / Home Equity">Financiamento / Home Equity</option>
          <option value="Wealth Management / Gestão Patrimonial">Wealth Management / Gestão Patrimonial</option>
          <option value="Seguro de Vida Estruturado">Seguro de Vida Estruturado</option>
          <option value="Previdência Privada">Previdência Privada</option>
          <option value="Investimentos no Exterior / Offshore">Investimentos no Exterior / Offshore</option>
          <option value="Câmbio e Remessas Internacionais">Câmbio e Remessas Internacionais</option>
          <option value="Alavancagem Patrimonial / Capital de Giro">Alavancagem Patrimonial / Capital de Giro</option>
          <option value="Outras Soluções de Crédito Estratégico">Outras Soluções de Crédito Estratégico</option>
        </select>
      </div>

      <div class="form-group">
        <label for="valor">Valor do Crédito / Aporte Desejado</label>
        <select id="valor" required>
          <option value="R$ 200.000 a R$ 500.000">R$ 200.000 a R$ 500.000</option>
          <option value="R$ 500.000 a R$ 1.000.000">R$ 500.000 a R$ 1.000.000</option>
          <option value="R$ 1.000.000 a R$ 3.000.000">R$ 1.000.000 a R$ 3.000.000</option>
          <option value="Acima de R$ 3.000.000">Acima de R$ 3.000.000</option>
        </select>
      </div>

      <button type="button" class="btn-submit" id="btnEnviar" onclick="enviarSimulacaoEHubspot()">Solicitar Estudo Personalizado</button>
    </form>
  </div>
</main>

<footer>
  <div class="wrap">
    <span>Bezerra Strategic © Todos os direitos reservados.</span>
  </div>
</footer>

<script>
  function mascaraTelefone(input) {
    let valor = input.value.replace(/\D/g, "");
    if (valor.length > 11) valor = valor.slice(0, 11);

    if (valor.length > 10) {
      valor = valor.replace(/^(\d{2})(\d{5})(\d{4})$/, "($1) $2-$3");
    } else if (valor.length > 6) {
      valor = valor.replace(/^(\d{2})(\d{4,5})(\d{0,4})$/, "($1) $2-$3");
    } else if (valor.length > 2) {
      valor = valor.replace(/^(\d{2})(\d{0,5})$/, "($1) $2");
    } else if (valor.length > 0) {
      valor = valor.replace(/^(\d*)/, "($1");
    }
    input.value = valor;
  }

  function enviarSimulacaoEHubspot() {
    const nomeCompleto = document.getElementById('nome').value.trim();
    const email = document.getElementById('email').value.trim();
    const telefone = document.getElementById('telefone').value.trim();
    const objetivo = document.getElementById('objetivo').value;
    const valor = document.getElementById('valor').value;

    if (!nomeCompleto || !email || !telefone) {
      alert('Por favor, preencha o seu nome, e-mail e telefone para continuar.');
      return;
    }

    const btn = document.getElementById('btnEnviar');
    btn.innerText = "ENVIANDO DADOS...";
    btn.disabled = true;

    const partesNome = nomeCompleto.split(" ");
    const primeironome = partesNome[0];
    const sobrenome = partesNome.slice(1).join(" ") || ".";

    const portalId = "51784410";
    const formId = "9463f943-26bd-43e4-a6f8-d4c94b20ad59";
    const endpointHubspot = `https://api.hsforms.com/submissions/v3/integration/submit/${portalId}/${formId}`;

    const payloadHubspot = {
      fields: [
        { name: "firstname", value: primeironome },
        { name: "lastname", value: sobrenome },
        { name: "email", value: email },
        { name: "phone", value: telefone },
        { name: "mobilephone", value: telefone },
        { name: "message", value: `Simulação Bezerra Strategic:\n- Telefone: ${telefone}\n- Objetivo: ${objetivo}\n- Valor do Crédito/Aporte: ${valor}` }
      ]
    };

    fetch(endpointHubspot, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payloadHubspot)
    }).then(() => {
      redirecionarParaWhatsapp();
    }).catch(err => {
      console.error("Erro ao enviar ao HubSpot:", err);
      redirecionarParaWhatsapp();
    });
  }

  function redirecionarParaWhatsapp() {
    const numeroWhatsapp = "5547988307859";
    const mensagem = encodeURIComponent("Olá! Preenchi o formulário no site da Bezerra Strategic e gostaria de receber o estudo personalizado.");
    window.location.href = `https://api.whatsapp.com/send?phone=${numeroWhatsapp}&text=${mensagem}`;
  }
</script>

</body>
</html>
