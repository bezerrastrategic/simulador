<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bezerra Strategic | Estudo Personalizado</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #0b1724; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; color: #ffffff; line-height: 1.6; }
    
    header { background-color: #08111c; border-bottom: 1px solid #1a2f44; padding: 15px 20px; text-align: center; position: sticky; top: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; }
    .brand-title { font-family: 'Garamond', 'Baskerville', serif; font-size: 18px; font-weight: bold; letter-spacing: 2px; color: #ffffff; }
    .btn-back { color: #d4af37; text-decoration: none; font-size: 13px; font-weight: 500; }
    .btn-back:hover { text-decoration: underline; }

    .main-container { padding: 40px 20px; min-height: 80vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background: radial-gradient(circle at top, #11253a 0%, #0b1724 100%); }
    
    .form-container { width: 100%; max-width: 480px; background: #0f1f33; border: 1px solid #1a3554; border-radius: 12px; padding: 30px 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: left; }
    .form-title { font-family: 'Garamond', serif; font-size: 22px; color: #d4af37; margin-bottom: 8px; text-align: center; }
    .form-subtitle { font-size: 13px; color: #a0aec0; text-align: center; margin-bottom: 25px; }

    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; font-size: 12px; color: #cbd5e1; margin-bottom: 6px; font-weight: 500; }
    .form-group input, .form-group select { width: 100%; padding: 12px 14px; background-color: #0b1724; border: 1px solid #1a3554; border-radius: 6px; color: #ffffff; font-size: 14px; outline: none; }
    .form-group input:focus, .form-group select:focus { border-color: #d4af37; }
    
    .btn-submit { width: 100%; padding: 15px 0; background: linear-gradient(135deg, #d4af37 0%, #aa8416 100%); border: 1px solid #b89324; border-radius: 6px; color: #0b1724; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 10px; box-shadow: 0 4px 10px rgba(212, 175, 55, 0.2); transition: all 0.2s ease; }
    .btn-submit:hover { background: linear-gradient(135deg, #f1c40f 0%, #d4af37 100%); }

    footer { padding: 25px 20px; text-align: center; border-top: 1px solid #1a2f44; background-color: #08111c; }
    .footer-name { font-family: 'Garamond', serif; font-size: 15px; color: #ffffff; }
    .footer-partner { font-size: 11px; color: #718096; margin-top: 4px; }
</style>
</head>
<body>

<header>
    <a href="index.html" class="btn-back">← Voltar ao site</a>
    <div class="brand-title">BEZERRA STRATEGIC</div>
    <div style="width: 80px;"></div> <!-- Espaçador para centralizar a logo -->
</header>

<div class="main-container">
    <div class="form-container">
        <div class="form-title">Estudo Patrimonial Personalizado</div>
        <div class="form-subtitle">Preencha os dados abaixo para receber uma simulação direcionada ao seu objetivo.</div>
        
        <form id="simuladorForm">
            <div class="form-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" placeholder="Digite seu nome" required>
            </div>

            <div class="form-group">
                <label for="email">E-mail Profissional</label>
                <input type="email" id="email" placeholder="seuemail@dominio.com" required>
            </div>

            <div class="form-group">
                <label for="telefone">WhatsApp / Telefone</label>
                <input type="tel" id="telefone" placeholder="(47) 99999-9999" maxlength="15" oninput="mascaraTelefone(this)" required>
            </div>
            
            <div class="form-group">
                <label for="objetivo">Objetivo Principal</label>
                <select id="objetivo" required>
                    <option value="Consórcio Imobiliário / Aquisição de Imóvel">Consórcio Imobiliário / Aquisição de Imóvel</option>
                    <option value="Consórcio de Veículos / Frota / Pesados">Consórcio de Veículos / Frota / Pesados</option>
                    <option value="Planejamento Financeiro & Gestão Patrimonial">Planejamento Financeiro & Gestão Patrimonial</option>
                    <option value="Alavancagem Patrimonial & Capital de Giro">Alavancagem Patrimonial & Capital de Giro</option>
                    <option value="Construção, Reforma e Investimentos">Construção, Reforma e Investimentos</option>
                    <option value="Outras Soluções de Crédito Estratégico">Outras Soluções de Crédito Estratégico</option>
                </select>
            </div>

            <div class="form-group">
                <label for="valor">Valor do Crédito / Aporte Desejado</label>
                <select id="valor" required>
                    <option value="R$ 200.000 a R$ 500.000">R$ 200.000 a R$ 500.000</option>
                    <option value="R$ 500.000 a R$ 1.000.000">R$ 500.000 a R$ 1.000.000</option>
                    <option value="R$ 1.000.000 a R$ 3.000.000">R$ 1.000.000 a R$ 3.000.000</option>
                    <option value="Acima de R$ 3.000.000">Acima de R$ 3.000.000</option>
                </select>
            </div>

            <button type="button" class="btn-submit" id="btnEnviar" onclick="enviarSimulacaoEHubspot()">📊 SOLICITAR ESTUDO PERSONALIZADO</button>
        </form>
    </div>
</div>

<footer>
    <div class="footer-name">Douglas Bezerra • Personal Banker</div>
    <div class="footer-partner">Parceiro Autorizado Univalores • Bezerra Strategic</div>
</footer>

<script>
    function mascaraTelefone(input) {
        let valor = input.value.replace(/\D/g, "");
        if (valor.length > 11) valor = valor.slice(0, 11);

        if (valor.length > 10) {
            valor = valor.replace(/^(\d{2})(\d{5})(\d{4})$/, "($1) $2-$3");
        } else if (valor.length > 6) {
            valor = valor.replace(/^(\d{2})(\d{4,5})(\d{0,4})$/, "($1) $2-$3");
        } else if (valor.length > 2) {
            valor = valor.replace(/^(\d{2})(\d{0,5})$/, "($1) $2");
        } else if (valor.length > 0) {
            valor = valor.replace(/^(\d*)/, "($1");
        }
        input.value = valor;
    }

    function enviarSimulacaoEHubspot() {
        const nomeCompleto = document.getElementById('nome').value.trim();
        const email = document.getElementById('email').value.trim();
        const telefone = document.getElementById('telefone').value.trim();
        const objetivo = document.getElementById('objetivo').value;
        const valor = document.getElementById('valor').value;

        if (!nomeCompleto || !email || !telefone) {
            alert('Por favor, preencha o seu nome, e-mail e telefone para continuar.');
            return;
        }

        const btn = document.getElementById('btnEnviar');
        btn.innerText = "ENVIANDO DADOS...";
        btn.disabled = true;

        const partesNome = nomeCompleto.split(" ");
        const primeironome = partesNome[0];
        const sobrenome = partesNome.slice(1).join(" ") || ".";

        const portalId = "51784410"; 
        const formId = "9463f943-26bd-43e4-a6f8-d4c94b20ad59"; 
        const endpointHubspot = `https://api.hsforms.com/submissions/v3/integration/submit/${portalId}/${formId}`;

        const payloadHubspot = {
            fields: [
                { name: "firstname", value: primeironome },
                { name: "lastname", value: sobrenome },
                { name: "email", value: email },
                { name: "phone", value: telefone },
                { name: "mobilephone", value: telefone },
                { name: "message", value: `Simulação Bezerra Strategic:\n- Telefone: ${telefone}\n- Objetivo: ${objetivo}\n- Valor do Crédito/Aporte: ${valor}` }
            ]
        };

        fetch(endpointHubspot, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payloadHubspot)
        }).then(() => {
            redirecionarParaWhatsapp();
        }).catch(err => {
            console.error("Erro ao enviar ao HubSpot:", err);
            redirecionarParaWhatsapp();
        });
    }

    function redirecionarParaWhatsapp() {
        const numeroWhatsapp = "5547988307859"; 
        const mensagem = encodeURIComponent("Olá! Preenchi o formulário no site da Bezerra Strategic e gostaria de receber o estudo personalizado.");
        
        window.location.href = `https://api.whatsapp.com/send?phone=${numeroWhatsapp}&text=${mensagem}`;
    }
</script>

</body>
</html>
