<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estudo Patrimonial | Bezerra Strategic</title>
<meta name="description" content="Solicite seu estudo patrimonial personalizado. Soluções em consórcios estruturados, crédito e wealth management.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">

<style>
  :root{
    --navy:#0B1D33;
    --navy-2:#122841;
    --ivory:#F6F3EC;
    --brass:#B8963E;
    --brass-light:#D9BE72;
    --slate:#5C6B7A;
    --line:rgba(246,243,236,0.14);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--navy);
    color:var(--ivory);
    font-family:'Inter', sans-serif;
    line-height:1.6;
  }
  a{color:inherit; text-decoration:none;}
  .wrap{max-width:800px; margin:0 auto; padding:0 24px;}

  header.top{
    background:var(--navy);
    padding:20px 0;
    border-bottom:1px solid var(--line);
  }
  header.top .wrap{
    display:flex;
    align-items:center;
    justify-content:space-between;
    max-width:1080px;
  }
  .brand img{height:50px; width:auto; border-radius:4px;}
  .btn-voltar{
    border:1px solid rgba(246,243,236,0.35);
    color:var(--ivory);
    padding:8px 18px;
    font-size:0.85rem;
    border-radius:3px;
    transition:background 0.2s ease;
  }
  .btn-voltar:hover{background:rgba(246,243,236,0.08);}

  .simulador-container{
    padding:60px 0 80px;
  }
  .simulador-card{
    background:var(--navy-2);
    border:1px solid var(--line);
    border-radius:8px;
    padding:40px 32px;
    box-shadow:0 16px 40px rgba(0,0,0,0.4);
  }
  .simulador-card h1{
    font-family:'Fraunces', serif;
    font-size:clamp(1.8rem, 3.5vw, 2.4rem);
    color:var(--ivory);
    margin-bottom:12px;
  }
  .simulador-card p.sub{
    color:rgba(246,243,236,0.75);
    font-size:0.98rem;
    margin-bottom:32px;
  }

  /* Estilização para o formulário do HubSpot se harmonizar com o tema escuro */
  .hs-form-frame {
    color: #fff !important;
  }
  .hs-form label {
    color: var(--ivory) !important;
    font-family: 'Inter', sans-serif !important;
    font-weight: 600 !important;
    font-size: 0.88rem !important;
  }
  .hs-input, .hs-field-desc {
    background: rgba(255,255,255,0.06) !important;
    border: 1px solid rgba(246,243,236,0.2) !important;
    color: #fff !important;
    border-radius: 4px !important;
    padding: 12px 16px !important;
  }
  .hs-button {
    background: var(--brass) !important;
    color: var(--navy) !important;
    width: 100% !important;
    padding: 16px !important;
    font-size: 1rem !important;
    font-weight: 700 !important;
    border: none !important;
    border-radius: 4px !important;
    cursor: pointer !important;
    transition: background 0.2s ease !important;
    text-transform: uppercase;
  }
  .hs-button:hover {
    background: var(--brass-light) !important;
  }

  footer{
    background:var(--navy);
    color:rgba(246,243,236,0.5);
    padding:32px 0;
    text-align:center;
    font-size:0.82rem;
    border-top:1px solid var(--line);
  }

  @media(max-width:600px){
    .simulador-card{padding:24px 16px;}
  }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a href="index.html" class="brand">
      <img src="banner.jpeg" alt="Bezerra Strategic">
    </a>
    <a href="index.html" class="btn-voltar">← Voltar ao site</a>
  </div>
</header>

<main class="wrap simulador-container">
  <div class="simulador-card">
    <h1>Estudo Patrimonial Personalizado</h1>
    <p class="sub">Preencha os dados abaixo para alinharmos a melhor estratégia de crédito, consórcio ou alavancagem para o seu momento.</p>

    <!-- FORMULÁRIO OFICIAL DO HUBSPOT -->
    <script src="https://js.hsforms.net/forms/embed/51784410.js" defer></script>
    <div class="hs-form-frame" data-region="na1" data-form-id="9463f943-26bd-43e4-a6f8-d4c94b20ad59" data-portal-id="51784410"></div>

  </div>
</main>

<footer>
  <div class="wrap">
    <span>Bezerra Strategic © Todos os direitos reservados.</span>
  </div>
</footer>

</body>
</html>
