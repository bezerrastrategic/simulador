<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estudo Patrimonial | Bezerra Strategic</title>
<meta name="description" content="Solicite seu estudo patrimonial personalizado. Soluções em consórcios estruturados, crédito e wealth management.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">

<style>
  :root{
    --navy:#0B1D33;
    --navy-2:#122841;
    --ivory:#F6F3EC;
    --brass:#B8963E;
    --brass-light:#D9BE72;
    --slate:#5C6B7A;
    --line:rgba(246,243,236,0.14);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--navy);
    color:var(--ivory);
    font-family:'Inter', sans-serif;
    line-height:1.6;
  }
  a{color:inherit; text-decoration:none;}
  .wrap{max-width:800px; margin:0 auto; padding:0 24px;}

  header.top{
    background:var(--navy);
    padding:32px 0 20px 0;
    border-bottom:1px solid var(--line);
    text-align:center;
  }
  header.top .banner-wrap{
    max-width:1080px;
    margin:0 auto;
    padding:0 16px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
  }
  .brand-banner{
    display:inline-block;
    width:100%;
    max-width:680px;
  }
  .brand-banner img{
    width:100%;
    height:auto;
    display:block;
    margin:0 auto;
    border-radius:0;
    box-shadow:none;
    transition:transform 0.2s ease;
  }
  .brand-banner img:hover{
    transform:scale(1.01);
  }

  .btn-voltar-subtil{
    color:rgba(246,243,236,0.6);
    font-size:0.8rem;
    text-transform:uppercase;
    letter-spacing:0.5px;
    transition:color 0.2s ease;
  }
  .btn-voltar-subtil:hover{
    color:var(--brass-light);
  }

  .simulador-container{padding:40px 0 80px;}
  
  .simulador-card{
    background:var(--ivory);
    border:1px solid rgba(184,150,62,0.3);
    border-radius:8px;
    padding:40px 32px;
    box-shadow:0 16px 40px rgba(0,0,0,0.4);
    color:var(--navy);
  }
  .simulador-card h1{
    font-family:'Fraunces', serif;
    font-size:clamp(1.8rem, 3.5vw, 2.4rem);
    color:var(--navy);
    margin-bottom:12px;
  }
  .simulador-card p.sub{
    color:var(--slate);
    font-size:0.98rem;
    margin-bottom:32px;
  }

  .hs-form-frame label,
  .hs-form-frame .hs-fieldlabel {
    color: var(--navy) !important;
    font-weight: 600 !important;
  }

  .hs-form-frame input[type="text"],
  .hs-form-frame input[type="email"],
  .hs-form-frame input[type="tel"],
  .hs-form-frame select {
    background-color: #FFFFFF !important;
    border: 1px solid #CBD5E1 !important;
    color: var(--navy) !important;
    border-radius: 4px !important;
  }

  footer{
    background:var(--navy);
    color:rgba(246,243,236,0.5);
    padding:32px 0;
    text-align:center;
    font-size:0.82rem;
    border-top:1px solid var(--line);
  }

  @media(max-width:600px){
    header.top{padding:20px 0 10px 0;}
    .brand-banner{max-width:100%;}
    .simulador-card{padding:24px 16px;}
    .simulador-container{padding:24px 0 60px;}
  }
</style>
</head>
<body>

<header class="top">
  <div class="banner-wrap">
    <a href="index.html" class="brand-banner" title="Voltar para a página inicial">
      <img src="banner.jpg?v=2" alt="Bezerra Strategic - Consórcios, Crédito e Planejamento">
    </a>
    <a href="index.html" class="btn-voltar-subtil">← Voltar ao site principal</a>
  </div>
</header>

<main class="wrap simulador-container">
  <div class="simulador-card">
    <h1>Estudo Patrimonial Personalizado</h1>
    <p class="sub">Preencha os dados abaixo para alinharmos a melhor estratégia de crédito, consórcio ou alavancagem para o seu momento.</p>

    <script src="https://js.hsforms.net/forms/embed/51784410.js" defer></script>
    <div class="hs-form-frame" data-region="na1" data-form-id="9463f943-26bd-43e4-a6f8-d4c94b20ad59" data-portal-id="51784410"></div>

  </div>
</main>

<footer>
  <div class="wrap">
    <span>Bezerra Strategic © Todos os direitos reservados.</span>
  </div>
</footer>

</body>
</html>
